services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance_db}
      MYSQL_USER: ${MYSQL_USER:-finance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finance}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-finance}:${MYSQL_PASSWORD:-finance}@db:3306/${MYSQL_DATABASE:-finance_db}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-finance}:${MYSQL_PASSWORD:-finance}@db:3306/${MYSQL_DATABASE:-finance_db}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
